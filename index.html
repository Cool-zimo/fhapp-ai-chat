<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI 聊天 · FaceHub 小程序</title>
<meta name="theme-color" content="#07C160">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🤖</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- 顶栏 -->
  <header id="top">
    <button id="btn-back" class="ico" title="返回">‹</button>
    <button id="model-chip" class="chip">
      <span id="model-name">选择模型</span><span class="caret">▾</span>
    </button>
    <div class="sp"></div>
    <button id="btn-hist" class="ico" title="历史">＋</button>
    <button id="btn-set" class="ico" title="设置">⚙</button>
  </header>

  <!-- 提示条：没配 key 时显示 -->
  <div id="banner" class="banner">
    <span id="banner-text"></span>
    <button id="banner-act" class="banner-btn"></button>
  </div>

  <!-- 消息区 -->
  <main id="msgs"></main>

  <!-- 输入区 -->
  <footer id="input-bar">
    <button id="btn-clear" class="ico" title="清空对话">🗑</button>
    <textarea id="inp" rows="1" placeholder="发消息…"></textarea>
    <button id="btn-send" class="send">发送</button>
    <button id="btn-stop" class="send stop" hidden>停止</button>
  </footer>

</div>

<!-- 设置面板 -->
<div id="sheet-mask" hidden></div>
<section id="sheet" hidden>
  <header class="sheet-top">
    <button id="sheet-close" class="ico">✕</button>
    <b id="sheet-title">设置</b>
    <div class="sp"></div>
    <button id="sheet-save" class="txt-btn">保存</button>
  </header>
  <div id="sheet-body" class="sheet-body"></div>
</section>

<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
